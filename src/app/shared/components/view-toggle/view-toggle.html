<nav
  aria-label="Choisir une vue"
  style="display: inline-flex; gap: 0.375rem; padding: 0.375rem; border: 1px solid #dbe3ee; border-radius: 0.875rem; background: rgb(255 255 255 / 85%); box-shadow: 0 8px 24px rgb(15 23 42 / 8%);"
>
  <button
    type="button"
    [style.fontWeight]="view() === 'tasks' ? '700' : '500'"
    [style.backgroundColor]="view() === 'tasks' ? '#2563eb' : 'transparent'"
    [style.color]="view() === 'tasks' ? '#fff' : '#475569'"
    (click)="viewChange.emit('tasks')"
    style="padding: 0.65rem 1.1rem; border: 0; border-radius: 0.625rem; font: inherit; cursor: pointer; transition: background-color 150ms ease, color 150ms ease;"
  >
    Par tâche
  </button>

  <button
    type="button"
    [style.fontWeight]="view() === 'users' ? '700' : '500'"
    [style.backgroundColor]="view() === 'users' ? '#2563eb' : 'transparent'"
    [style.color]="view() === 'users' ? '#fff' : '#475569'"
    (click)="viewChange.emit('users')"
    style="padding: 0.65rem 1.1rem; border: 0; border-radius: 0.625rem; font: inherit; cursor: pointer; transition: background-color 150ms ease, color 150ms ease;"
  >
    Par user
  </button>
</nav>
