<main style="width: 100%;">
  @if (selectedProject(); as selected) {
    <div
      role="status"
      style="margin-bottom: 1.5rem; padding: 0.85rem 1.25rem; border: 1px solid #bbf7d0; border-radius: 0.875rem; background: #f0fdf4; color: #166534; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;"
    >
      <span>Projet sélectionné : <strong style="font-size: 1.05rem;">{{ selected.name }}</strong></span>
      <button
        type="button"
        (click)="selectedProject.set(null)"
        style="padding: 0.25rem 0.65rem; border: 1px solid #86efac; border-radius: 0.5rem; background: #fff; color: #166534; font: inherit; font-size: 0.8rem; cursor: pointer;"
      >
        Désélectionner
      </button>
    </div>
  }

  <section
    aria-label="Projets"
    class="project-cards-grid"
  >
    @for (project of filteredProjects(); track project.id) {
      <app-project-card
        [project]="project"
        (projectSelected)="onProjectSelected($event)"
        (taskStatusChange)="onTaskStatusChange($event)"
        (taskDelete)="onTaskDelete($event)"
      />
    } @empty {
      <div
        style="grid-column: 1 / -1; margin: 2rem auto; padding: 2.5rem; border: 1px dashed #cbd5e1; border-radius: 1rem; background: rgba(255, 255, 255, 0.8); color: #64748b; text-align: center; max-width: 600px;"
      >
        <p style="margin: 0; font-size: 1.1rem; font-weight: 600; color: #334155;">
          Aucun projet ne correspond à votre recherche.
        </p>
        <p style="margin: 0.5rem 0 0; font-size: 0.9rem;">
          Essayez avec un autre mot-clé dans la barre de recherche.
        </p>
      </div>
    }
  </section>
</main>
