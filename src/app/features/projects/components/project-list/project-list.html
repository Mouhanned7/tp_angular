<main>
  <h1>TaskFlow</h1>

  <label for="search">Rechercher un projet</label>

  <input id="search" type="search" placeholder="Rechercher un projet..." [(ngModel)]="searchTerm" />

  @if (selectedProject(); as selected) {
    <p role="status">Projet sélectionné : {{ selected.name }}</p>
  }

  <section
    aria-label="Projets"
    style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; align-items: start;"
  >
    @for (project of filteredProjects(); track project.id) {
      <app-project-card [project]="project" (projectSelected)="onProjectSelected($event)" />
    } @empty {
      <p style="grid-column: 1 / -1;">Aucun projet trouvé.</p>
    }
  </section>
</main>
