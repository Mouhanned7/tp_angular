<section style="width: 100%;">
  <div class="user-cards-grid">
    @for (user of filteredUsers(); track user.id) {
      <app-user-card
        [user]="user"
        [projects]="projects()"
        (taskStatusChange)="onTaskStatusChange($event)"
        (taskDelete)="onTaskDelete($event)"
      />
    } @empty {
      <div style="grid-column: 1 / -1; margin: 2rem auto; max-width: 600px; width: 100%;">
        <app-empty-state message="Aucun utilisateur ne correspond à la recherche." />
      </div>
    }
  </div>
</section>
