<article
  appHighlight
  style="padding: 1.35rem 1.4rem; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04); display: flex; flex-direction: column; gap: 0.95rem; transition: border-color 0.15s ease, box-shadow 0.15s ease;"
>
  <!-- En-tête : Avatar, Nom, Rôle et Statut Actif/Inactif -->
  <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;">
    <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1;">
      <div
        [ngStyle]="{ backgroundColor: roleColor }"
        style="width: 2.75rem; height: 2.75rem; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #ffffff; font-size: 1rem; flex-shrink: 0;"
      >
        {{ user().name | initials }}
      </div>

      <div style="min-width: 0; overflow: hidden; flex: 1;">
        <h2 style="margin: 0; color: #0f172a; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ user().name | titlecase }}
        </h2>
        <p style="margin: 0.2rem 0 0; color: #64748b; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ user().email | lowercase }} · <span style="font-weight: 600; color: #334155;">{{ user().role }}</span>
        </p>
      </div>
    </div>

    <div style="flex-shrink: 0;">
      <span
        [style.backgroundColor]="user().active ? '#f0fdf4' : '#f8fafc'"
        [style.borderColor]="user().active ? '#bbf7d0' : '#e2e8f0'"
        [style.color]="user().active ? '#166534' : '#64748b'"
        style="padding: 0.2rem 0.6rem; border: 1px solid; border-radius: 999px; font-size: 0.75rem; font-weight: 600; display: inline-block;"
      >
        {{ user().active ? 'Actif' : 'Inactif' }}
      </span>
    </div>
  </header>

  <!-- Statistiques des tâches (composant StatBadgeGroup) -->
  <div
    style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.85rem 0.95rem;"
  >
    <app-stat-badge-group
      [badges]="taskStatBadges()"
      [totalText]="'Total : ' + tasks().length + ' tâche(s)'"
    />
  </div>

  <!-- Section Tâches par projet -->
  <section style="margin-top: 0.25rem;">
    @if (tasks().length === 0) {
      <app-empty-state message="Aucune tâche assignée à cet utilisateur." />
    } @else {
      @for (group of projectGroups(); track group.projectName) {
        <app-user-project-group
          [projectName]="group.projectName"
          [tasks]="group.tasks"
          (taskStatusChange)="onTaskStatusChange($event)"
          (taskDelete)="onTaskDelete($event)"
        />
      }
    }
  </section>
</article>
