<div
  style="min-height: 100vh; padding: 2rem 1.25rem; box-sizing: border-box; background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 48%, #eef2ff 100%); color: #1e293b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;"
>
  <div style="width: min(100%, 1100px); margin-inline: auto;">
    <header style="display: flex; justify-content: center; margin-bottom: 2rem;">
      <app-view-toggle
        [view]="view()"
        (viewChange)="view.set($event)"
      />
    </header>

    @if (view() === 'tasks') {
      <app-project-list />
    } @else {
      <app-user-list />
    }
  </div>
</div>
